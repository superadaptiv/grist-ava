<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LV-Editor</title>
  <link rel="stylesheet" href="style.css">
  <!-- Grist Plugin-API. Bei self-hosted Grist alternativ: https://<dein-grist>/grist-plugin-api.js -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    // Lokale Vorschau ohne Grist: index.html?demo
    if (new URLSearchParams(location.search).has("demo")) {
      document.write('<script src="../../dev/mock-grist.js"><\/script>');
    }
  </script>
</head>
<body>
<div class="app" id="app">

  <!-- ===== Icon-Leiste ===== -->
  <nav class="rail">
    <div class="logo">LV</div>
    <button type="button" class="ri on" data-view="edit" title="Liste bearbeiten">
      <svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h9"/></svg></button>
    <button type="button" class="ri" data-view="document" title="Dokumentansicht">
      <svg viewBox="0 0 20 20"><path d="M5 2.5h7l3 3v12H5z M12 2.5v3h3 M7.5 9h5M7.5 12h5M7.5 15h3"/></svg></button>
    <div class="menu-wrap">
      <button type="button" class="ri" id="printMenuButton" title="Drucken / Export">
        <svg viewBox="0 0 20 20"><path d="M6 7V2.5h8V7 M6 14H3.5V7h13v7H14 M6 11.5h8v6H6z"/></svg></button>
      <div class="menu" id="printMenu" hidden>
        <button type="button" data-print="ausschreibung"><b>Ausschreibung</b><small>ohne Preise, mit Bieterfeldern</small></button>
        <button type="button" data-print="kostenanschlag"><b>Kostenanschlag</b><small>mit Kostenansatz (EP/GB)</small></button>
        <button type="button" data-print="kurz"><b>Kurz-LV</b><small>nur Kurztexte, mit Preisen</small></button>
        <hr>
        <button type="button" id="exportTypstButton"><b>Typst-Datei</b><small>für eigenes Layout</small></button>
      </div>
    </div>
    <span class="rail-sp"></span>
    <button type="button" class="ri" id="refreshButton" title="Neu laden">
      <svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3 M16 3v3.5h-3.5"/></svg></button>
    <button type="button" class="ri" id="settingsButton" title="Einstellungen">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"/></svg></button>
  </nav>

  <!-- ===== Mitte ===== -->
  <section class="mid">
    <header class="bar">
      <div class="ctx">
        <select id="lvSelect" class="sel-lv" title="Leistungsverzeichnis"></select>
        <span class="sep">·</span>
        <select id="projectSelect" class="sel-pr" title="Projekt"></select>
        <span id="lvStatus" class="status" hidden></span>
        <button type="button" class="link" id="newLvButton" title="Neues Projekt oder LV anlegen">+ LV</button>
      </div>
      <label class="cmd">
        <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
        <input type="search" id="search" placeholder="Suchen: OZ, Kurztext, Langtext …" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
      <span id="saveStatus" class="save-status">Bereit</span>
      <button type="button" class="btn btn-primary" id="addPositionButton">+ Position</button>
    </header>

    <div id="schemaBanner" class="banner" hidden>
      <div><b id="schemaBannerTitle">Datenmodell erweitern</b> <span id="schemaBannerText"></span></div>
      <button type="button" class="btn btn-primary" id="schemaButton">Jetzt anlegen</button>
    </div>

    <div class="scroll">
      <div class="list" id="list"></div>
      <div class="paper" id="documentView" hidden></div>
    </div>
  </section>

  <!-- ===== Inspector ===== -->
  <aside class="inspector" id="inspector">
    <div class="ins-body">
      <form id="posPanel" autocomplete="off" hidden>
        <div class="ins-h"><span>Position</span><button type="button" class="x" id="closeInspector" title="Schließen (Esc)">✕</button></div>
        <div class="ins-oz" id="inspectorOz">–</div>
        <div class="muted ins-path" id="inspectorPath"></div>

        <label class="f"><span>Kurztext</span>
          <input type="text" id="fKurztext" class="big" placeholder="Kurzbeschreibung der Leistung"></label>
        <label class="f"><span>Langtext</span>
          <textarea id="fLangtext" rows="4" placeholder="Ausführliche Leistungsbeschreibung"></textarea></label>
        <div class="grid-2">
          <label class="f"><span>Menge</span><input type="text" inputmode="decimal" id="fMenge" class="num"></label>
          <label class="f"><span>Einheit</span><input type="text" id="fEinheit" list="unitList"><datalist id="unitList"></datalist></label>
          <label class="f"><span>Einheitspreis €</span><input type="text" inputmode="decimal" id="fEinheitspreis" class="num"></label>
          <div class="f"><span>Gesamtbetrag</span><output id="fGesamt" class="out">0,00 €</output></div>
        </div>
        <div class="f"><span>Positionsart</span><div class="seg" id="typeSeg"></div></div>
        <label class="switch"><input type="checkbox" id="fAktiv"><span>Aktiv (inaktive Positionen fehlen im Druck)</span></label>
        <div class="ins-foot">
          <span class="muted" id="dirtyIndicator"></span>
          <span class="spacer"></span>
          <button type="button" class="link" id="duplicateButton">Duplizieren</button>
          <button type="button" class="link danger" id="deleteButton">Löschen</button>
        </div>
      </form>
      <div id="summaryPanel"></div>
    </div>
    <div class="ins-total"><span>LV netto</span><b id="lvNet">0,00 €</b></div>
  </aside>
</div>
<div id="globalMessage" class="toast" hidden></div>

<!-- ===== Dialog: Titel ===== -->
<dialog id="titleDialog" class="dialog">
  <form method="dialog" id="titleForm">
    <h2 id="titleDialogHeading">Titel</h2>
    <label class="field"><span>Bezeichnung</span><input type="text" id="tBezeichnung" required></label>
    <label class="field"><span>Vorbemerkung (optional)</span><textarea id="tVorbemerkung" rows="4"></textarea></label>
    <div class="dialog-foot">
      <button type="button" class="btn btn-danger" id="tDelete">Löschen</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="tCancel">Abbrechen</button>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<!-- ===== Dialog: Projekt / LV anlegen ===== -->
<dialog id="quickStartDialog" class="dialog">
  <form method="dialog" id="quickStartForm">
    <h2>Neues Leistungsverzeichnis</h2>
    <p class="muted" id="qProjectHint"></p>
    <label class="switch"><input type="checkbox" id="qNewProject"><span>Neues Projekt anlegen</span></label>
    <div id="qProjectFields">
      <div class="grid-2">
        <label class="field"><span>Projektnummer</span><input type="text" id="qProjektnummer" placeholder="z. B. 2601"></label>
        <label class="field"><span>Projektname</span><input type="text" id="qProjektname" placeholder="z. B. Anbau M52"></label>
      </div>
      <label class="field"><span>Bauherr / Auftraggeber</span><input type="text" id="qBauherr"></label>
      <label class="field"><span>Straße</span><input type="text" id="qStrasse"></label>
      <div class="grid-2">
        <label class="field"><span>PLZ</span><input type="text" id="qPLZ"></label>
        <label class="field"><span>Ort</span><input type="text" id="qOrt"></label>
      </div>
    </div>
    <div class="grid-2">
      <label class="field"><span>LV-Nummer</span><input type="text" id="qLvNummer" placeholder="z. B. 02" required></label>
      <label class="field"><span>Gewerk</span><input type="text" id="qGewerk" placeholder="z. B. Rohbau"></label>
    </div>
    <label class="field"><span>LV-Bezeichnung</span><input type="text" id="qLvName" placeholder="z. B. Rohbauarbeiten" required></label>
    <div class="dialog-foot">
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="qCancel">Abbrechen</button>
      <button type="submit" class="btn btn-primary">Anlegen</button>
    </div>
  </form>
</dialog>

<!-- ===== Dialog: Einstellungen ===== -->
<dialog id="settingsDialog" class="dialog">
  <form method="dialog" id="settingsForm">
    <h2>Einstellungen</h2>
    <p class="muted">Diese Angaben erscheinen im Druck als Planer-Block. Sie werden in den Widget-Optionen gespeichert.</p>
    <label class="field"><span>Büro / Planer</span><input type="text" id="sPlaner"></label>
    <label class="field"><span>Anschrift (mehrzeilig)</span><textarea id="sAnschrift" rows="3"></textarea></label>
    <label class="field"><span>Ansprechpartner, Telefon, E-Mail (mehrzeilig)</span><textarea id="sKontakt" rows="3"></textarea></label>
    <div class="grid-2">
      <label class="field"><span>MwSt.-Satz %</span><input type="text" id="sMwst" class="num"></label>
      <label class="field"><span>Schrittweite Positionen</span><input type="text" id="sStep" class="num"></label>
    </div>
    <div class="dialog-foot">
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="sCancel">Abbrechen</button>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
